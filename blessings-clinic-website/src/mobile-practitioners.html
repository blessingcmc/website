<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practitioners - Blessings Chinese Medicine Clinic</title>
    <link rel="stylesheet" href="assets/css/mobile-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="mobile-navbar">
        <button class="hamburger" id="menu-toggle" aria-label="Open navigation menu">
            <span></span><span></span><span></span>
        </button>
        <span class="clinic-name" data-i18n="clinicName">Blessings Chinese Medicine Clinic</span>
        <button id="lang-switch" class="lang-switch">中文</button>
    </header>
    <nav class="mobile-nav-menu" id="mobile-nav-menu">
        <ul>
            <li><a href="mobile-home.html" data-i18n="navigation.home">Home</a></li>
            <li><a href="mobile-practitioners.html" data-i18n="navigation.practitioners">Practitioners</a></li>
            <li><a href="mobile-treatments.html" data-i18n="navigation.treatments">Treatments</a></li>
            <li><a href="mobile-contact.html" data-i18n="navigation.contact">Contact Us</a></li>
        </ul>
    </nav>

    <section id="practitioners">
        <div class="content-wrapper">
            <h2 class="section-heading" data-i18n="practitioners.title"></h2>
            <div class="practitioner-content">
                <div class="practitioner" data-doctor="agnes">
                    <div class="practitioner-info">
                        <img src="assets/images/doctors/agnes.jpg" alt="Dr. Agnes">
                        <div class="info-text">
                            <h3 class="doctor-name" data-i18n="practitioners.agnes.name"></h3>
                            <p class="doctor-bio" data-i18n="practitioners.agnes.description"></p>
                            <div class="doctor-specialties">
                                <h4 data-i18n="practitioners.specialties">Specialties</h4>
                                <p class="specialties-text" data-i18n="practitioners.agnes.specialties"></p>
                            </div>
                            <div class="doctor-schedule">
                                <h4 data-i18n="practitioners.schedule">Schedule</h4>
                                <p class="schedule-text" data-i18n="practitioners.agnes.schedule"></p>
                            </div>
                            <div class="doctor-social">
                                <a href="https://instagram.com/agnes_instagram" class="instagram-link" target="_blank">
                                    <i class="fab fa-instagram"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="practitioner" data-doctor="mandy">
                    <div class="practitioner-info">
                        <img src="assets/images/doctors/mandy.jpg" alt="Dr. Mandy">
                        <div class="info-text">
                            <h3 class="doctor-name" data-i18n="practitioners.mandy.name"></h3>
                            <p class="doctor-bio" data-i18n="practitioners.mandy.description"></p>
                            <div class="doctor-specialties">
                                <h4 data-i18n="practitioners.specialties">Specialties</h4>
                                <p class="specialties-text" data-i18n="practitioners.mandy.specialties"></p>
                            </div>
                            <div class="doctor-schedule">
                                <h4 data-i18n="practitioners.schedule">Schedule</h4>
                                <p class="schedule-text" data-i18n="practitioners.mandy.schedule"></p>
                            </div>
                            <div class="doctor-social">
                                <a href="https://instagram.com/mandy_instagram" class="instagram-link" target="_blank">
                                    <i class="fab fa-instagram"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="practitioner" data-doctor="lf">
                    <div class="practitioner-info">
                        <img src="assets/images/doctors/lf.jpg" alt="Dr. LF">
                        <div class="info-text">
                            <h3 class="doctor-name" data-i18n="practitioners.lf.name"></h3>
                            <p class="doctor-bio" data-i18n="practitioners.lf.description"></p>
                            <div class="doctor-specialties">
                                <h4 data-i18n="practitioners.specialties">Specialties</h4>
                                <p class="specialties-text" data-i18n="practitioners.lf.specialties"></p>
                            </div>
                            <div class="doctor-schedule">
                                <h4 data-i18n="practitioners.schedule">Schedule</h4>
                                <p class="schedule-text" data-i18n="practitioners.lf.schedule"></p>
                            </div>
                            <div class="doctor-social">
                                <a href="https://instagram.com/lf_instagram" class="instagram-link" target="_blank">
                                    <i class="fab fa-instagram"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="assets/js/mobile-app.js"></script>
</body>
</html>
